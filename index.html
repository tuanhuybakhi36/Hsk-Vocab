<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập & Đăng ký - Học Từ Vựng HSK</title>
  <style>
    :root {
      --primary-color: #d32f2f;      /* Màu đỏ chủ đạo */
      --primary-hover: #b71c1c;      /* Đỏ đậm khi hover */
      --bg-color: #f8f9fa;           /* Nền xám nhẹ */
      --white: #ffffff;
      --text-color: #333333;
      --gray-light: #eeeeee;
      --gray-text: #777777;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-container {
      background-color: var(--white);
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border-top: 5px solid var(--primary-color);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .auth-header h1 {
      color: var(--primary-color);
      font-size: 24px;
      margin-bottom: 8px;
    }

    .auth-header p {
      color: var(--gray-text);
      font-size: 14px;
    }

    /* Tab Switcher giữa Đăng Nhập & Đăng Ký */
    .tab-buttons {
      display: flex;
      border-bottom: 2px solid var(--gray-light);
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-text);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      color: var(--primary-color);
      border-bottom: 3px solid var(--primary-color);
    }

    /* Form Styles */
    .auth-form {
      display: none;
      flex-direction: column;
      gap: 15px;
    }

    .auth-form.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-color);
    }

    .form-group input {
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary-color);
    }

    .btn-submit {
      background-color: var(--primary-color);
      color: var(--white);
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    /* Thông báo lỗi / thành công */
    .message {
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
    .message.error {
      color: #d32f2f;
      display: block;
    }
    .message.success {
      color: #388e3c;
      display: block;
    }

    /* Phần Admin đặt nhỏ gọn bên dưới */
    .admin-section {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px dashed #ddd;
      text-align: center;
    }

    .admin-link {
      color: var(--gray-text);
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .admin-link:hover {
      color: var(--primary-color);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <h1>Học Từ Vựng HSK</h1>
      <p>Chào mừng bạn! Vui lòng đăng nhập để bắt đầu học.</p>
    </div>

    <!-- Nút chuyển Tab Đăng Nhập / Đăng Ký -->
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('login')">Đăng Nhập</button>
      <button class="tab-btn" onclick="switchTab('register')">Đăng Ký</button>
    </div>

    <!-- Form Đăng Nhập -->
    <form id="loginForm" class="auth-form active">
      <div class="form-group">
        <label for="loginUser">Tài khoản / Email</label>
        <input type="text" id="loginUser" placeholder="Nhập tài khoản" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Mật khẩu</label>
        <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" required />
      </div>
      <button type="submit" id="submitBtn" class="btn-submit">Đăng Nhập</button>
    </form>

    <!-- Form Đăng Ký (Để giao diện trông đầy đủ) -->
    <form id="registerForm" class="auth-form">
      <div class="form-group">
        <label for="regName">Họ và Tên</label>
        <input type="text" id="regName" placeholder="Tên hiển thị của bạn" required />
      </div>
      <div class="form-group">
        <label for="regUser">Tài khoản</label>
        <input type="text" id="regUser" placeholder="Tạo tên tài khoản" required />
      </div>
      <div class="form-group">
        <label for="regPassword">Mật khẩu</label>
        <input type="password" id="regPassword" placeholder="Nhập mật khẩu" required />
      </div>
      <button type="submit" class="btn-submit">Tạo Tài Khoản</button>
    </form>

    <!-- Thông báo lỗi hoặc thành công -->
    <div id="authMessage" class="message"></div>

    <!-- Phần Admin nhỏ phía dưới cùng -->
    <div class="admin-section">
      <a class="admin-link" id="adminLoginToggle" onclick="enableAdminMode()">
        🔑 Đăng nhập với tư cách là Vua (Admin)
      </a>
    </div>
  </div>

  <script>
    // ⚙️ THÔNG TIN TÀI KHOẢN ĐƯỢC CẤU HÌNH TẠI ĐÂY (Sau này muốn đổi cứ đổi ở đây nhé)
    const VALID_USER = "sieubakhi123";
    const VALID_PASS = "12367";

    let isAdminMode = false;

    // Chuyển đổi giữa Đăng nhập / Đăng ký
    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const buttons = document.querySelectorAll('.tab-btn');
      clearMessage();

      if (tab === 'login') {
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
        buttons[0].classList.add('active');
        buttons[1].classList.remove('active');
      } else {
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
        buttons[1].classList.add('active');
        buttons[0].classList.remove('active');
      }
    }

    // Bật/tắt chế độ Đăng nhập Admin
    function enableAdminMode() {
      isAdminMode = !isAdminMode;
      const toggleBtn = document.getElementById('adminLoginToggle');
      const submitBtn = document.getElementById('submitBtn');
      
      switchTab('login');

      if (isAdminMode) {
        toggleBtn.innerText = "⬅️ Quay lại đăng nhập Học viên";
        toggleBtn.style.color = "#d32f2f";
        submitBtn.innerText = "Đăng Nhập Admin";
      } else {
        toggleBtn.innerText = "🔑 Đăng nhập với tư cách Quản trị viên (Admin)";
        toggleBtn.style.color = "var(--gray-text)";
        submitBtn.innerText = "Đăng Nhập";
      }
    }

    // Hiển thị thông báo
    function showMessage(msg, isError = true) {
      const msgEl = document.getElementById('authMessage');
      msgEl.innerText = msg;
      msgEl.className = `message ${isError ? 'error' : 'success'}`;
    }

    function clearMessage() {
      const msgEl = document.getElementById('authMessage');
      msgEl.className = 'message';
      msgEl.innerText = '';
    }

    // XỬ LÝ ĐĂNG NHẬP
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPassword').value;

      // Kiểm tra tài khoản và mật khẩu
      if (username === VALID_USER && password === VALID_PASS) {
        if (isAdminMode) {
          showMessage("Đăng nhập Admin thành công!", false);
        } else {
          showMessage("Đăng nhập thành công! Đang chuyển hướng...", false);
        }

        // Chuyển sang trang hsk.html sau 1 giây
        setTimeout(() => {
          window.location.href = "hsk.html";
        }, 1000);

      } else {
        showMessage("Tài khoản hoặc mật khẩu không chính xác!");
      }
    });

    // XỬ LÝ ĐĂNG KÝ (Mô phỏng thông báo thành công cho vui)
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      showMessage("Đăng ký thành công! Hãy dùng tài khoản chung để đăng nhập nhé.", false);
      setTimeout(() => {
        switchTab('login');
      }, 1500);
    });
  </script>
</body>
</html>
